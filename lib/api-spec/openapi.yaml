openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GHIC Engineering Intelligence Platform API
servers:
  - url: /api
    description: Base API path
security:
  - firebaseBearer: []
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard overview
  - name: repositories
    description: Repository management
  - name: issues
    description: Issue management
  - name: commits
    description: Commit intelligence
  - name: pullrequests
    description: Pull request intelligence
  - name: releases
    description: Release intelligence
  - name: components
    description: Component explorer
  - name: duplicates
    description: Duplicate intelligence
  - name: regressions
    description: Regression center
  - name: automation
    description: Automation center
  - name: intelligence
    description: Engineering intelligence
  - name: analytics
    description: Repository analytics
  - name: search
    description: Global search
  - name: notifications
    description: Notifications
  - name: integrations
    description: Integrations
  - name: apikeys
    description: API key management
  - name: organization
    description: Organization management
  - name: settings
    description: Settings
  - name: auditlogs
    description: Audit logs
  - name: systemhealth
    description: System health

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────────────────────
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      tags: [dashboard]
      summary: Get the authenticated dashboard in one request
      responses:
        "200":
          description: Live dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard overview statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Get recent alerts
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  # ─── Repositories ────────────────────────────────────────────────────────────
  /repositories:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: List all connected repositories
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Repositories list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryListResponse"

  /repositories/{id}:
    get:
      operationId: getRepository
      tags: [repositories]
      summary: Get repository details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Repository details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"

  /repositories/{id}/sync:
    post:
      operationId: syncRepository
      tags: [repositories]
      summary: Sync a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /repositories/{id}/reindex:
    post:
      operationId: reindexRepository
      tags: [repositories]
      summary: Reindex a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reindex triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /repositories/{id}/analytics:
    get:
      operationId: getRepositoryAnalytics
      tags: [analytics]
      summary: Get analytics for a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: period
          schema: { type: string }
      responses:
        "200":
          description: Repository analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryAnalytics"

  /repositories/{id}/commits:
    get:
      operationId: getRepositoryCommits
      tags: [commits]
      summary: Get commits for a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"

  /repositories/{id}/pull-requests:
    get:
      operationId: getRepositoryPullRequests
      tags: [pullrequests]
      summary: Get pull requests for a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Pull requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestListResponse"

  /repositories/{id}/releases:
    get:
      operationId: getRepositoryReleases
      tags: [releases]
      summary: Get releases for a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: number }
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseListResponse"

  /repositories/{id}/components:
    get:
      operationId: getRepositoryComponents
      tags: [components]
      summary: Get components for a repository
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: number }
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentListResponse"

  # ─── Issues ──────────────────────────────────────────────────────────────────
  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues with filters
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: severity
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: classification
          schema: { type: string }
        - in: query
          name: assignee
          schema: { type: string }
        - in: query
          name: label
          schema: { type: string }
        - in: query
          name: aiStatus
          schema: { type: string }
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueListResponse"

  /issues/{id}:
    get:
      operationId: getIssue
      tags: [issues]
      summary: Get issue details with AI analysis
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issue detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueDetail"

  /issues/{id}/bulk-update:
    patch:
      operationId: bulkUpdateIssues
      tags: [issues]
      summary: Bulk update issues
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"

  # ─── Commits ─────────────────────────────────────────────────────────────────
  /commits:
    get:
      operationId: listCommits
      tags: [commits]
      summary: List all commits with intelligence
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: author
          schema: { type: string }
        - in: query
          name: risk
          schema: { type: string }
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitListResponse"

  # ─── Pull Requests ────────────────────────────────────────────────────────────
  /pull-requests:
    get:
      operationId: listPullRequests
      tags: [pullrequests]
      summary: List all pull requests
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: author
          schema: { type: string }
        - in: query
          name: risk
          schema: { type: string }
      responses:
        "200":
          description: Pull requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestListResponse"

  # ─── Releases ────────────────────────────────────────────────────────────────
  /releases:
    get:
      operationId: listReleases
      tags: [releases]
      summary: List all releases
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseListResponse"

  # ─── Components ───────────────────────────────────────────────────────────────
  /components:
    get:
      operationId: listComponents
      tags: [components]
      summary: List all detected components
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: health
          schema: { type: string }
      responses:
        "200":
          description: Components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentListResponse"

  # ─── Duplicates ───────────────────────────────────────────────────────────────
  /duplicates:
    get:
      operationId: listDuplicateClusters
      tags: [duplicates]
      summary: List duplicate issue clusters
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: minSimilarity
          schema: { type: number }
      responses:
        "200":
          description: Duplicate clusters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateClusterListResponse"

  # ─── Regressions ──────────────────────────────────────────────────────────────
  /regressions:
    get:
      operationId: listRegressions
      tags: [regressions]
      summary: List regressions
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: confidence
          schema: { type: string }
      responses:
        "200":
          description: Regressions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegressionListResponse"

  # ─── Automation ───────────────────────────────────────────────────────────────
  /automation/suggestions:
    get:
      operationId: listAutomationSuggestions
      tags: [automation]
      summary: List AI automation suggestions
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: repositoryId
          schema: { type: string }
      responses:
        "200":
          description: Automation suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationSuggestionListResponse"

  /automation/suggestions/{id}/approve:
    post:
      operationId: approveAutomationSuggestion
      tags: [automation]
      summary: Approve an automation suggestion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /automation/suggestions/{id}/reject:
    post:
      operationId: rejectAutomationSuggestion
      tags: [automation]
      summary: Reject an automation suggestion
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ─── Engineering Intelligence ─────────────────────────────────────────────────
  /intelligence/summary:
    get:
      operationId: getIntelligenceSummary
      tags: [intelligence]
      summary: Get engineering intelligence summary
      parameters:
        - in: query
          name: repositoryId
          schema: { type: string }
      responses:
        "200":
          description: Intelligence summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSummary"

  /intelligence/root-causes:
    get:
      operationId: listRootCauses
      tags: [intelligence]
      summary: Root cause explorer
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: repositoryId
          schema: { type: string }
      responses:
        "200":
          description: Root causes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootCauseEntry"

  /intelligence/historical-patterns:
    get:
      operationId: listHistoricalPatterns
      tags: [intelligence]
      summary: Historical patterns
      parameters:
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: period
          schema: { type: string }
      responses:
        "200":
          description: Historical patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoricalPattern"

  /intelligence/risk-analysis:
    get:
      operationId: getRiskAnalysis
      tags: [intelligence]
      summary: Risk analysis across repositories
      parameters:
        - in: query
          name: repositoryId
          schema: { type: string }
      responses:
        "200":
          description: Risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAnalysis"

  # ─── Analytics ────────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get analytics overview across all repositories
      parameters:
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: period
          schema: { type: string }
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  # ─── Search ───────────────────────────────────────────────────────────────────
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across all entities
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: page
          schema: { type: number }
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  # ─── Notifications ────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: unreadOnly
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ─── Integrations ─────────────────────────────────────────────────────────────
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List all integrations
      responses:
        "200":
          description: Integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /integrations/{id}/toggle:
    post:
      operationId: toggleIntegration
      tags: [integrations]
      summary: Enable or disable an integration
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ─── API Keys ─────────────────────────────────────────────────────────────────
  /api-keys:
    get:
      operationId: listApiKeys
      tags: [apikeys]
      summary: List API keys
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"

    post:
      operationId: createApiKey
      tags: [apikeys]
      summary: Create a new API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"

  /api-keys/{id}:
    delete:
      operationId: deleteApiKey
      tags: [apikeys]
      summary: Delete an API key
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  # ─── Organization ─────────────────────────────────────────────────────────────
  /me:
    get:
      operationId: getCurrentAccount
      tags: [settings]
      summary: Get the authenticated GHIC workspace account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAccount"

  /me/settings:
    patch:
      operationId: updateCurrentAccountSettings
      tags: [settings]
      summary: Update the authenticated user's persisted preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardAccountSettingsPatch"
      responses:
        "200":
          description: Updated current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAccount"

  /organization:
    get:
      operationId: getOrganization
      tags: [organization]
      summary: Get organization details
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    patch:
      operationId: updateOrganization
      tags: [organization]
      summary: Rename the GHIC workspace (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceName: { type: string }
              required: [workspaceName]
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"

  /organization/members:
    get:
      operationId: listMembers
      tags: [organization]
      summary: List organization members
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: role
          schema: { type: string }
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"

  /organization/members/{id}:
    patch:
      operationId: updateMember
      tags: [organization]
      summary: Update member role
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  # ─── Settings ─────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  # ─── Audit Logs ───────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [auditlogs]
      summary: List audit logs
      parameters:
        - in: query
          name: page
          schema: { type: number }
        - in: query
          name: limit
          schema: { type: number }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: repositoryId
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string }
        - in: query
          name: endDate
          schema: { type: string }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  # ─── System Health ────────────────────────────────────────────────────────────
  /system-health:
    get:
      operationId: getSystemHealth
      tags: [systemhealth]
      summary: Get system health status
      responses:
        "200":
          description: System health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"

components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

