      required: [category, description, severity, repositoryName]

    # ─── Analytics Overview ───────────────────────────────────────────────────
    AnalyticsOverview:
      type: object
      properties:
        period: { type: string }
        totalIssues: { type: number }
        analyzedIssues: { type: number }
        resolvedIssues: { type: number }
        openIssues: { type: number }
        bugsDetected: { type: number }
        regressions: { type: ["number", "null"] }
        duplicatesFound: { type: number }
        avgResolutionDays: { type: ["number", "null"] }
        averageAnalysisLatencyMs: { type: ["number", "null"] }
        retrievalSuccessRate: { type: ["number", "null"] }
        issuesByPriority:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        issuesBySeverity:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        issuesByClassification:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        issuesByRepository:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"
      required:
        - period
        - totalIssues
        - analyzedIssues
        - resolvedIssues
        - openIssues
        - bugsDetected
        - regressions
        - duplicatesFound
        - avgResolutionDays
        - averageAnalysisLatencyMs
        - retrievalSuccessRate
        - issuesByPriority
        - issuesBySeverity
        - issuesByClassification
        - issuesByRepository
        - trend

    CategoryCount:
      type: object
      properties:
        category: { type: string }
        count: { type: number }
      required: [category, count]

    # ─── Search ───────────────────────────────────────────────────────────────
    SearchResults:
      type: object
      properties:
        query: { type: string }
        total: { type: number }
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        code:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        commits:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        pullRequests:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        components:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        releases:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
      required:
        - query
        - total
        - repositories
        - issues
        - code
        - commits
        - pullRequests
        - components
        - releases

    SearchResultItem:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        description: { type: ["string", "null"] }
        repositoryName: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        score: { type: ["number", "null"] }
        matchType: { type: string }
        timestamp: { type: ["string", "null"] }
      required: [id, type, title, score]

    # ─── Notification ─────────────────────────────────────────────────────────
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        severity: { type: string }
        title: { type: string }
        description: { type: string }
        repositoryName: { type: ["string", "null"] }
        read: { type: boolean }
        timestamp: { type: string }
        link: { type: ["string", "null"] }
      required: [id, type, severity, title, description, read, timestamp]

    NotificationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total: { type: number }
        unread: { type: number }
        page: { type: number }
        limit: { type: number }
      required: [items, total, unread, page, limit]

    # ─── Integration ──────────────────────────────────────────────────────────
    Integration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        enabled: { type: boolean }
        status: { type: string }
        webhookUrl: { type: ["string", "null"] }
        lastPingAt: { type: ["string", "null"] }
        configuredAt: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
      required: [id, name, type, enabled, status]

    # ─── API Key ──────────────────────────────────────────────────────────────
    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: string }
        lastUsedAt: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        rateLimit: { type: number }
        usageCount: { type: number }
      required: [id, name, prefix, scopes, createdAt, rateLimit, usageCount]

    ApiKeyInput:
      type: object
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: string }
        rateLimit: { type: number }
      required: [name, scopes]

    # ─── Organization ─────────────────────────────────────────────────────────
    DashboardAccount:
      type: object
      properties:
        id: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        role: { type: string, enum: [viewer, member, admin, owner] }
        settings:
          $ref: "#/components/schemas/DashboardAccountSettings"
        createdAt: { type: ["string", "null"] }
        lastLogin: { type: ["string", "null"] }
      required: [id, name, email, avatarUrl, role, settings]

    DashboardAccountSettings:
      type: object
      properties:
        displayName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        theme: { type: string, enum: [system, light, dark] }
        timezone: { type: string }
        emailPreferences:
          type: object
          properties:
            productUpdates: { type: boolean }
            weeklyDigest: { type: boolean }
          required: [productUpdates, weeklyDigest]
        notificationPreferences:
          type: object
          properties:
            criticalAlerts: { type: boolean }
            regressions: { type: boolean }
            duplicates: { type: boolean }
          required: [criticalAlerts, regressions, duplicates]
      required:
        [
          displayName,
          avatarUrl,
          theme,
          timezone,
          emailPreferences,
          notificationPreferences,
        ]

    DashboardAccountSettingsPatch:
      type: object
      properties:
        displayName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        theme: { type: string, enum: [system, light, dark] }
        timezone: { type: string }
        emailPreferences:
          type: object
          additionalProperties: { type: boolean }
        notificationPreferences:
          type: object
          additionalProperties: { type: boolean }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        workspaceName: { type: string }
        slug: { type: string }
        avatarUrl: { type: ["string", "null"] }
        plan: { type: string }
        memberCount: { type: number }
        repositoryCount: { type: number }
        createdAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
      required:
        [
          id,
          name,
          workspaceName,
          slug,
          plan,
          memberCount,
          repositoryCount,
          createdAt,
          updatedAt,
        ]

    Member:
      type: object
      properties:
        id: { type: string }
        login: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        role: { type: string }
        joinedAt: { type: ["string", "null"] }
        lastActiveAt: { type: ["string", "null"] }
      required: [id, login, role, joinedAt]

    MemberListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total: { type: number }
        page: { type: number }
        limit: { type: number }
      required: [items, total, page, limit]

    MemberUpdate:
      type: object
      properties:
        role: { type: string }

    # ─── Settings ─────────────────────────────────────────────────────────────
    Settings:
      type: object
      properties:
        general:
          $ref: "#/components/schemas/GeneralSettings"
        llmProvider: { type: string }
        embeddingProvider: { type: string }
        automationEnabled: { type: boolean }
        notificationsEnabled: { type: boolean }
        repositoryIntelligenceEnabled: { type: boolean }
        engineeringIntelligenceEnabled: { type: boolean }
        featureFlags:
          type: object
          additionalProperties: { type: boolean }
      required:
        - general
        - llmProvider
        - embeddingProvider
        - automationEnabled
        - notificationsEnabled
        - repositoryIntelligenceEnabled
        - engineeringIntelligenceEnabled

    GeneralSettings:
      type: object
      properties:
        organizationName: { type: string }
        defaultBranch: { type: string }
        timezone: { type: string }
        language: { type: string }
      required: [organizationName, defaultBranch, timezone, language]

    SettingsUpdate:
      type: object
      properties:
        llmProvider: { type: string }
        embeddingProvider: { type: string }
        automationEnabled: { type: boolean }
        notificationsEnabled: { type: boolean }
        repositoryIntelligenceEnabled: { type: boolean }
        engineeringIntelligenceEnabled: { type: boolean }

    # ─── Audit Log ────────────────────────────────────────────────────────────
    AuditLog:
      type: object
      properties:
        id: { type: string }
        timestamp: { type: string }
        user: { type: string }
        userAvatarUrl: { type: ["string", "null"] }
        repositoryName: { type: ["string", "null"] }
        action: { type: string }
        modelVersion: { type: ["string", "null"] }
        evidence: { type: ["string", "null"] }
        executionTimeMs: { type: ["number", "null"] }
        result: { type: string }
        ipAddress: { type: ["string", "null"] }
      required: [id, timestamp, user, action, result]

    AuditLogListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: number }
        page: { type: number }
        limit: { type: number }
      required: [items, total, page, limit]

    # ─── System Health ────────────────────────────────────────────────────────
    SystemHealth:
      type: object
      properties:
        overall: { type: string }
        webhookStatus: { type: string }
        queueStatus: { type: string }
        queueLength: { type: ["number", "null"] }
        databaseStatus: { type: string }
        vectorStoreStatus: { type: string }
        embeddingProviderStatus: { type: string }
        llmProviderStatus: { type: string }
        repositoryIntelligenceStatus: { type: string }
        engineeringIntelligenceStatus: { type: string }
        automationStatus: { type: string }
        autoIndex: { type: ["boolean", "null"] }
        githubApiStatus: { type: string }
        githubApiRateLimit: { type: ["number", "null"] }
        githubApiRateLimitRemaining: { type: ["number", "null"] }
        processingLatencyMs: { type: ["number", "null"] }
        averageResponseTimeMs: { type: ["number", "null"] }
        failedJobsLast24h: { type: ["number", "null"] }
        uptimePercent: { type: ["number", "null"] }
        lastCheckedAt: { type: string }
        version: { type: ["string", "null"] }
        model: { type: ["string", "null"] }
        embeddingSignature: { type: ["string", "null"] }
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceHealth"
      required:
        - overall
        - webhookStatus
        - queueStatus
        - queueLength
        - databaseStatus
        - vectorStoreStatus
        - embeddingProviderStatus
        - llmProviderStatus
        - repositoryIntelligenceStatus
        - engineeringIntelligenceStatus
        - automationStatus
        - autoIndex
        - githubApiStatus
        - githubApiRateLimit
        - githubApiRateLimitRemaining
        - processingLatencyMs
        - averageResponseTimeMs
        - failedJobsLast24h
        - uptimePercent
        - lastCheckedAt

    ServiceHealth:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
        latencyMs: { type: ["number", "null"] }
        errorMessage: { type: ["string", "null"] }
        lastCheckedAt: { type: string }
      required: [name, status, lastCheckedAt]
